
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Simulador Conecta Cell</title>
    <style>
        body {
            background-color: #000;
            color: #004393;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 30px 10px;
        }
        h1 {
            color: #004393;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .logo img {
            height: 200px;
        }
        input, button {
            padding: 10px;
            margin: 6px;
            font-size: 15px;
            border-radius: 6px;
            border: none;
        }
        input {
            width: 180px;
            box-shadow: 0 0 5px #004393;
        }
        button {
            background-color: #004393;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #004393;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 95%;
            max-width: 480px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #004393;
            padding: 8px;
        }
        th {
            background-color: #111;
        }
        #debito {
            margin-top: 20px;
            font-size: 17px;
            color: #00ff99;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="logo.png" alt="Logo Conecta Cell" />
    </div>
    <h1>Simulador de Parcelas</h1>

    <input type="number" id="valor" placeholder="Valor da Compra" />
    <button onclick="simular()">Calcular</button>
    <button onclick="copiarWhatsapp()">Copiar WhatsApp</button>

    <div id="debito"></div>

    <table>
        <thead>
            <tr>
                <th>Parcelas</th>
                <th>Parcela (R$)</th>
                <th>Total (R$)</th>
            </tr>
        </thead>
        <tbody id="resultado"></tbody>
    </table>

    <script>
        const taxas = [0.0629, 0.0859, 0.0916, 0.0973, 0.1037, 0.1085, 0.1147, 0.1204, 0.1264, 0.1322, 0.1384, 0.234];
        let ultimaSimulacao = "";

        function simular() {
            const valor = parseFloat(document.getElementById('valor').value);
            const debito = valor / (1 - 0.025);
            document.getElementById("debito").innerText = "Débito: R$ " + debito.toFixed(2);
            let html = "";
            let textoWhatsapp = "Débito: R$ " + debito.toFixed(2) + "\n\nParcelamento:\n";

            for (let i = 0; i < taxas.length; i++) {
                let total = valor / (1 - taxas[i]);
                let parcela = total / (i + 1);
                html += "<tr><td>" + (i + 1) + "x</td><td>R$ " + parcela.toFixed(2) + "</td><td>R$ " + total.toFixed(2) + "</td></tr>";
                textoWhatsapp += (i + 1) + "x de R$ " + parcela.toFixed(2) + " (Total: R$ " + total.toFixed(2) + ")\n";
            }

            document.getElementById("resultado").innerHTML = html;
            ultimaSimulacao = textoWhatsapp;
        }

        function copiarWhatsapp() {
            if (ultimaSimulacao === "") {
                alert("Primeiro clique em 'Calcular' para gerar a tabela.");
                return;
            }
            navigator.clipboard.writeText(ultimaSimulacao).then(() => {
                alert("Tabela copiada! Agora é só colar no WhatsApp.");
            });
        }
    </script>
</body>
</html>
